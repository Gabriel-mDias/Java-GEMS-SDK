# ============================================================================
# Main Branch Validation
# ----------------------------------------------------------------------------
# Executado a cada push na branch `main`. Compila e roda os testes novamente,
# sem publicar artefatos.
#
# Publicação pertence exclusivamente ao workflow `release.yml`, disparado por
# tag imutável `v*` depois de aprovação humana. Isso impede publicar a mesma
# versão no merge e tentar republicá-la pela tag.
# ============================================================================
name: Main Validation

on:
  push:
    branches:
      - main

# Garante um único deploy por vez na main, evitando publicações concorrentes.
concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v7

      - name: Configurar JDK 21 (Temurin) com cache do Maven
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes (mvn verify)
        # Barreira de qualidade: nada é publicado se os testes falharem.
        run: mvn --batch-mode --errors clean verify -DgenerateBackupPoms=false

      - name: Sucesso
        if: success()
        run: echo "::notice title=Validação concluída::A main está verde; nenhum artefato foi publicado."

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          echo "::error title=Validação da main falhou::O build, os testes ou um gate de qualidade falhou."
          echo "::error::Reproduza com: mvn --batch-mode --errors clean verify -DgenerateBackupPoms=false"
